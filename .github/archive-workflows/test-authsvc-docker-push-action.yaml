name: integration tests for authsvc using docker build push action
on:
  push
jobs: 
  test-authsvc:
    runs-on: ubuntu-latest
    environment: test
    defaults:
      run:
        working-directory: ./auth-svc
        # Remove the services: block entirely and manage it in steps
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create Custom Docker Network
        run: docker network create authsvc-net

      - name: Start PostgreSQL Container
        run: >
          docker run -d --rm --name db-authsvc --network authsvc-net
          -e POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}"
          -e POSTGRES_USER="${{ secrets.POSTGRES_USER }}"
          -e POSTGRES_DB="${{ secrets.POSTGRES_DB }}"
          postgres:18
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker Image with Cloud Cache
        uses: docker/build-push-action@v6
        with:
          # Point explicitly to your subfolder context
          context: ./auth-svc
          file: ./auth-svc/dockerfile
          target: prerelease
          tags: authsvc-test:latest
          provenance: false
          sbom: false
          # Force export back to the local Docker daemon for 'docker run'
          load: true 
          
          # GitHub Actions Native Cache Backends
          cache-from: type=gha
          cache-to: type=gha,mode=max

      
      - name: Run DB Migrations
        # Pass the name of your custom network
        run: >
          docker run --rm --network authsvc-net
          -e DOTENV_PRIVATE_KEY_DEVELOPMENT=$DOTENV_PRIVATE_KEY_DEVELOPMENT 
          authsvc-test:latest bun run drizzlekit-dev migrate
        env:
          DOTENV_PRIVATE_KEY_DEVELOPMENT: ${{ secrets.DOTENV_PRIVATE_KEY_DEVELOPMENT }}

      - name: Run Tests in Container
        run: >
          docker run --rm --network authsvc-net
          -e DOTENV_PRIVATE_KEY_DEVELOPMENT=$DOTENV_PRIVATE_KEY_DEVELOPMENT 
          authsvc-test:latest bun run test
        env:
          DOTENV_PRIVATE_KEY_DEVELOPMENT: ${{ secrets.DOTENV_PRIVATE_KEY_DEVELOPMENT }}
