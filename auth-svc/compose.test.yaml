services:
  build-test:
    image: authsvc-test:latest
    build:
      context: .
      target: prerelease
    command: ["bun", "run", "drizzlekit-dev", "migrate"]
    environment:
      - DOTENV_PRIVATE_KEY_DEVELOPMENT
    networks:
      - testauth
    depends_on: 
      db-authsvc:
        condition: service_healthy
        
  
  test:
    image: authsvc-test:latest
    build:
      context: .
      target: prerelease
    environment:
      - DOTENV_PRIVATE_KEY_DEVELOPMENT
    command: ['bun', 'run', 'test']
    networks:
      - testauth
    depends_on: 
      build-test:
        condition: service_completed_successfully
    develop:
      watch:
        - path: .
          ignore:
          - ./node_modules
          - ./package.json
          action: sync
          target: /auth-svc/
        - path: ./package.json
          action: rebuild
  
  db-authsvc:
    image: postgres:alpine
    environment:
      - POSTGRES_PASSWORD
      - POSTGRES_USER
      - POSTGRES_DB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      timeout: 4s
      interval: 2s
    networks: 
      - testauth
  
networks:
  testauth:

    
    